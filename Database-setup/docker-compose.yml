---
# Docker Compose for AI Learning Portal
# PostgreSQL is now hosted on Supabase - only Weaviate runs locally

services:
  weaviate:
    command:
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --scheme
      - http
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.1
    container_name: ai_tutor_weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: on-failure:0
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-openai'
      ENABLE_MODULES: 'text2vec-openai'
      OPENAI_APIKEY: ${OPENAI_API_KEY}
      CLUSTER_HOSTNAME: 'node1'
    networks:
      - ai_tutor_network

  weaviate_init:
    image: python:3.11-slim
    container_name: ai_tutor_weaviate_init
    depends_on:
      - weaviate
    volumes:
      - ./Vector DB/scripts:/scripts:ro
      - ./.env:/app/.env:ro
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      WEAVIATE_URL: http://weaviate:8080
    working_dir: /scripts
    command: >
      sh -c "
        pip install --no-cache-dir weaviate-client python-dotenv &&
        sleep 10 &&
        python setup_weaviate.py &&
        python load_data.py
      "
    restart: "no"
    networks:
      - ai_tutor_network

volumes:
  weaviate_data:

networks:
  ai_tutor_network:
    driver: bridge
