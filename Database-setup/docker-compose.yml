---
version: '3.4'
services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_tutor_postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./PostgreSQL/scripts/init_database.sql:/docker-entrypoint-initdb.d/init_database.sql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_tutor_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ai_tutor_db}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_tutor_admin} -d ${POSTGRES_DB:-ai_tutor_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_tutor_network

  # yaml
  db_init:
    image: postgres:15-alpine
    container_name: ai_tutor_db_init
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./PostgreSQL/scripts/mock_data_insert.sql:/docker-entrypoint-initdb.d/mock_data_insert.sql:ro
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-ai_tutor_admin}
      POSTGRES_DB: ${POSTGRES_DB:-ai_tutor_db}
    command: [ "sh", "-c", "until pg_isready -h postgres -U ${POSTGRES_USER:-ai_tutor_admin} -d ${POSTGRES_DB:-ai_tutor_db}; do sleep 1; done; psql -h postgres -U ${POSTGRES_USER:-ai_tutor_admin} -d ${POSTGRES_DB:-ai_tutor_db} -f /docker-entrypoint-initdb.d/mock_data_insert.sql" ]
    restart: "no"
    networks:
      - ai_tutor_network

  weaviate:
    command:
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --scheme
      - http
    image: cr.weaviate.io/semitechnologies/weaviate:1.26.1
    container_name: ai_tutor_weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: on-failure:0
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-openai'
      ENABLE_MODULES: 'text2vec-openai'
      OPENAI_APIKEY: ${OPENAI_API_KEY}
      CLUSTER_HOSTNAME: 'node1'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai_tutor_network

volumes:
  postgres_data:
  weaviate_data:

networks:
  ai_tutor_network:
    driver: bridge
