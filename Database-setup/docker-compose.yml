version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_tutor_postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./PostgreSQL/scripts/init_database.sql:/docker-entrypoint-initdb.d/01_init_database.sql
      - ./PostgreSQL/scripts/sessions_table.sql:/docker-entrypoint-initdb.d/02_sessions_table.sql
      - ./PostgreSQL/scripts/add_documents_table.sql:/docker-entrypoint-initdb.d/03_add_documents_table.sql
      - ./PostgreSQL/scripts/add_prompts_column.sql:/docker-entrypoint-initdb.d/04_add_prompts_column.sql
    environment:
      POSTGRES_USER: ai_tutor_admin
      POSTGRES_PASSWORD: promptpal123
      POSTGRES_DB: ai_tutor_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_tutor_admin -d ai_tutor_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_tutor_network

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.1
    container_name: ai_tutor_weaviate
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --scheme
      - http
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "text2vec-openai"
      ENABLE_MODULES: "text2vec-openai"
      OPENAI_APIKEY: ${OPENAI_API_KEY}
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - ai_tutor_network
    restart: unless-stopped

  weaviate_init:
    image: python:3.11-slim
    container_name: ai_tutor_weaviate_init
    depends_on:
      - weaviate
    working_dir: /scripts
    command: >
      sh -c "
        pip install --no-cache-dir weaviate-client python-dotenv pandas pypdf &&
        echo '⏳ Waiting for Weaviate...' &&
        sleep 10 &&
        python setup_weaviate.py &&
        python load_data.py &&
        echo '✅ Weaviate setup + data load complete'
      "
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      WEAVIATE_URL: http://weaviate:8080
    volumes:
      - ./VectorDB/scripts:/scripts:ro
      - ./VectorDB/data:/data:ro
      - ./.env:/app/.env:ro
    networks:
      - ai_tutor_network
    restart: "no"

volumes:
  postgres_data:
  weaviate_data:

networks:
  ai_tutor_network:
    driver: bridge
